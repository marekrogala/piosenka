{% extends "base.html" %}

{% block title %}Artykuły{% endblock %}

{% block content %}
<div class="pzt-container">
  <section class="card-grid">
    {% for article in articles %}
    <a href="{{ article.get_absolute_url }}" class="block section-card" style="padding:0;text-decoration:none;overflow:hidden">
      <div class="thumbnail-host">
        <img src="{{ article.thumb_url }}" class="pzt-article-thumb" alt="" />
        <div class="thumbnail-caption">
          <h2>{{ article.title }}</h2>
        </div>
      </div>
      <div class="prose-pzt" style="padding:14px 16px">
        {{ article.lead_html|safe }}
      </div>
    </a>
    {% endfor %}
  </section>
</div>
{% endblock content %}
